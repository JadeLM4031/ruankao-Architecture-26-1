    text: "某智慧农业物联网系统的以下设计要素归属的层次，**错误**的是：",
    options: [
      "A. 土壤温湿度传感器、病虫害识别摄像头 → 感知层",
      "B. NB-IoT广覆盖低功耗传输、LoRa自建园区网络 → 网络层",
      "C. 设备管理平台（注册/OTA升级）、规则引擎、时序数据库存储 → 应用层",
      "D. 面向农户的灌溉预警小程序、API开放平台 → 应用层"
    ],
    answer: 2,
    analysis: "正确答案：C（归属错误项）\n\n设备管理（注册/OTA）、规则引擎、数据汇聚与时序数据库属于**平台层**——平台层是物联网的“中场发动机”（设备接入+设备管理+数据汇聚+业务使能四大组件），不是应用层。应用层是最终面向行业的App/大屏/API开放。\n\n【分层口诀】感知采集→网络传输→平台管理→应用服务。\n\n【选型锚点】\n- NB-IoT：广覆盖/低功耗/小数据/低成本（抄表、农业）——运营商网络\n- LoRa：自建私有网络（园区、农场自己部署网关）\n- 5G：大带宽低时延（视频回传、车联网）\n- ZigBee：短距离Mesh（智能家居）\n\n案例物联网题=四层填空+每层技术名词+绑业务场景，2026上你现场编的就是这题的变体。"
  }
];

let userAnswers={}, totalQuestions=questions.length, choiceCorrect=0;

function renderQuestions(){const c=document.getElementById('questionsContainer');let h='';questions.forEach(q=>{const tc=q.tagClass||(q.type==='choice'?'tag-choice':'tag-case');h+=`<div class="q-card" id="qcard-${q.id}"><div class="q-header"><span class="q-tag ${tc}">${q.tag}</span><span class="q-score">${q.score}分</span></div><div class="q-number">第 ${q.id} 题</div><div class="q-text">${q.text}</div>`;if(q.type==='choice'){h+=`<div class="options" id="opts-${q.id}">`;q.options.forEach((o,i)=>{h+=`<button class="opt-btn" id="opt-${q.id}-${i}" onclick="selectOption(${q.id},${i})">${o}</button>`;});h+=`</div><div class="btn-row"><button class="btn btn-primary" id="submit-${q.id}" onclick="submitChoice(${q.id})" disabled>提交答案</button></div>`;}else{h+=`<textarea class="case-input" id="input-${q.id}" placeholder="在此输入你的答案（按题目要求的格式作答）..."></textarea><div class="btn-row"><button class="btn btn-primary" id="submit-${q.id}" onclick="submitCase(${q.id})">提交答案</button></div>`;}h+=`<div class="analysis" id="analysis-${q.id}"></div></div>`;});c.innerHTML=h;}

function selectOption(qid,oi){if(userAnswers[qid]&&userAnswers[qid].submitted)return;document.querySelectorAll(`[id^="opt-${qid}-"]`).forEach(o=>o.classList.remove('selected'));document.getElementById(`opt-${qid}-${oi}`).classList.add('selected');document.getElementById(`submit-${qid}`).disabled=false;userAnswers[qid]={type:'choice',selected:oi,submitted:false};saveState();}

function submitChoice(qid){if(!userAnswers[qid]||userAnswers[qid].submitted)return;userAnswers[qid].submitted=true;const q=questions.find(x=>x.id===qid),sel=userAnswers[qid].selected,cor=q.answer,ok=sel===cor;if(ok)choiceCorrect++;document.querySelectorAll(`[id^="opt-${qid}-"]`).forEach(o=>o.classList.add('disabled'));document.getElementById(`opt-${qid}-${cor}`).classList.add('correct-answer');if(!ok)document.getElementById(`opt-${qid}-${sel}`).classList.add('wrong-answer');const card=document.getElementById(`qcard-${qid}`);card.classList.add('answered',ok?'correct-card':'wrong-card');card.querySelector('.q-number').innerHTML+=ok?`<span class="score-badge score-correct">+ ${q.score}分</span>`:`<span class="score-badge score-wrong">+ 0分</span>`;const ae=document.getElementById(`analysis-${qid}`);ae.innerHTML=`<h4>解析</h4><p>${q.analysis.replace(/\n/g,'<br>')}</p>`;ae.classList.add('show');document.getElementById(`submit-${qid}`).disabled=true;document.getElementById(`submit-${qid}`).textContent='已提交';updateProgress();saveState();}

function submitCase(qid){const inp=document.getElementById(`input-${qid}`),ans=inp.value.trim();if(!ans){alert('请先输入你的答案');return;}if(userAnswers[qid]&&userAnswers[qid].submitted)return;userAnswers[qid]={type:'case',answer:ans,submitted:true};inp.disabled=true;document.getElementById(`submit-${qid}`).disabled=true;document.getElementById(`submit-${qid}`).textContent='已提交';const card=document.getElementById(`qcard-${qid}`);card.classList.add('answered','case-card');card.querySelector('.q-number').innerHTML+='<span class="score-badge" style="background:#ede9fe;color:#7c3aed">待教练评分</span>';const q=questions.find(x=>x.id===qid),ae=document.getElementById(`analysis-${qid}`);ae.innerHTML=`<h4>参考答案</h4><p>${q.sampleAnswer.replace(/\n/g,'<br>')}</p>${q.scoringGuide?`<h4 style="margin-top:12px">评分标准</h4><p>${q.scoringGuide.replace(/\n/g,'<br>')}</p>`:''}`;ae.classList.add('show');updateProgress();saveState();}

function updateProgress(){const a=Object.values(userAnswers).filter(x=>x.submitted).length;document.getElementById('doneCount').textContent=a;document.getElementById('correctCount').textContent=choiceCorrect+'/4';const cs=questions.filter(q=>q.type==='choice'&&userAnswers[q.id]&&userAnswers[q.id].submitted&&userAnswers[q.id].selected===q.answer).reduce((s,q)=>s+q.score,0);document.getElementById('totalScore').textContent=cs+'/26';document.getElementById('progressFill').style.width=(a/totalQuestions*100)+'%';if(a===totalQuestions)document.getElementById('generateBtn').disabled=false;}

function generateReport(){let r=`=== 冲刺第6关：案例手感+高并发+物联网 答题报告 ===\n日期：${new Date().toLocaleDateString('zh-CN')}\n选择题正确：${choiceCorrect}/4\n案例题3道（20分）：待教练评分\n\n`;questions.forEach(q=>{const ua=userAnswers[q.id];r+=`--- 第${q.id}题（${q.tag}，${q.score}分）---\n`;if(q.type==='choice'){r+=`我的答案：${String.fromCharCode(65+ua.selected)}\n正确答案：${String.fromCharCode(65+q.answer)}\n结果：${ua.selected===q.answer?'✓ 正确（+'+q.score+'分）':'✗ 错误（+0分）'}\n`;}else{r+=`我的答案（${q.score}分，待教练评分）：\n${ua.answer}\n`;}r+='\n';});r+='=== 报告结束 ===';document.getElementById('reportText').value=r;document.getElementById('reportSection').classList.add('show');document.getElementById('reportSection').scrollIntoView({behavior:'smooth'});saveState();}

function copyReport(){const ta=document.getElementById('reportText');ta.select();navigator.clipboard.writeText(ta.value).then(()=>{const b=event.target;b.textContent='✓ 已复制';setTimeout(()=>{b.textContent='一键复制';},2000);}).catch(()=>{document.execCommand('copy');alert('已复制');});}

const QUIZ_KEY='archQuiz_sprint6';
function saveState(){try{const state={answers:{},report:document.getElementById('reportText').value};Object.keys(userAnswers).forEach(k=>{const ua=userAnswers[k];state.answers[k]=ua.type==='case'?{type:'case',answer:ua.answer,submitted:ua.submitted}:{type:'choice',selected:ua.selected,submitted:ua.submitted};});localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}catch(e){}}
function resetQuiz(){if(confirm('确定清空所有作答记录并重新开始？')){try{localStorage.removeItem(QUIZ_KEY);}catch(e){}location.reload();}}
function loadState(){try{const d=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');if(!d||!d.answers)return;Object.keys(d.answers).forEach(k=>{const ua=d.answers[k];const q=questions.find(x=>x.id==k);if(!q)return;if(ua.type==='case'){if(ua.answer!==undefined){document.getElementById(`input-${k}`).value=ua.answer;userAnswers[k]={type:'case',answer:ua.answer,submitted:false};if(ua.submitted){const inp=document.getElementById(`input-${k}`);inp.disabled=true;const card=document.getElementById(`qcard-${k}`);card.classList.add('answered','case-card');card.querySelector('.q-number').innerHTML+='<span class="score-badge" style="background:#ede9fe;color:#7c3aed">待教练评分</span>';const ae=document.getElementById(`analysis-${k}`);ae.innerHTML=`<h4>参考答案</h4><p>${q.sampleAnswer.replace(/\n/g,'<br>')}</p>${q.scoringGuide?`<h4 style="margin-top:12px">评分标准</h4><p>${q.scoringGuide.replace(/\n/g,'<br>')}</p>`:''}`;ae.classList.add('show');document.getElementById(`submit-${k}`).disabled=true;document.getElementById(`submit-${k}`).textContent='已提交';userAnswers[k].submitted=true;}}}else{if(ua.selected===undefined)return;document.getElementById(`opt-${k}-${ua.selected}`).classList.add('selected');document.getElementById(`submit-${k}`).disabled=false;userAnswers[k]={type:'choice',selected:ua.selected,submitted:false};if(ua.submitted){const cor=q.answer,ok=ua.selected===cor;if(ok)choiceCorrect++;document.querySelectorAll(`[id^="opt-${k}-"]`).forEach(o=>o.classList.add('disabled'));document.getElementById(`opt-${k}-${cor}`).classList.add('correct-answer');if(!ok)document.getElementById(`opt-${k}-${ua.selected}`).classList.add('wrong-answer');const card=document.getElementById(`qcard-${k}`);card.classList.add('answered',ok?'correct-card':'wrong-card');card.querySelector('.q-number').innerHTML+=ok?`<span class="score-badge score-correct">+ ${q.score}分</span>`:`<span class="score-badge score-wrong">+ 0分</span>`;const ae=document.getElementById(`analysis-${k}`);ae.innerHTML=`<h4>解析</h4><p>${q.analysis.replace(/\n/g,'<br>')}</p>`;ae.classList.add('show');document.getElementById(`submit-${k}`).disabled=true;document.getElementById(`submit-${k}`).textContent='已提交';userAnswers[k].submitted=true;}}});if(d.report){document.getElementById('reportText').value=d.report;document.getElementById('reportSection').classList.add('show');}updateProgress();}catch(e){}}

renderQuestions();
loadState();
</script>
</body>
</html>
