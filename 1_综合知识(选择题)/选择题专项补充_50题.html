<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择题专项补充 · 50题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#e8edf3;color:#333;line-height:1.8;font-size:16px}
.top-bar{background:#6b5b95;color:#fff;padding:0 18px;height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar .exam-title{font-size:16px;font-weight:bold}
.top-bar .right-info{display:flex;align-items:center;gap:20px;font-size:14px}
.top-bar .stats{opacity:.9}
.top-bar .timer{font-variant-numeric:tabular-nums;font-weight:600}
.top-bar .submit-top{background:#fff;color:#6b5b95;border:none;padding:5px 20px;border-radius:3px;font-size:14px;font-weight:bold;cursor:pointer}
.main-wrap{display:flex;height:calc(100vh - 48px);overflow:hidden}
.left-panel{width:250px;min-width:250px;background:#fff;border-right:1px solid #d5dce6;display:flex;flex-direction:column}
.left-panel .panel-title{padding:12px 14px 8px;font-size:15px;font-weight:bold;color:#333;border-bottom:1px solid #eee;text-align:center}
.answer-card-area{flex:1;overflow-y:auto;padding:8px 10px}
.ac-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ac-btn{aspect-ratio:1.3;border:1px solid #ccc;border-radius:2px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#555;transition:all .1s}
.ac-btn:hover{background:#e0ecfa}
.ac-btn.current{background:#6b5b95;color:#fff;border-color:#6b5b95;font-weight:bold}
.ac-btn.done{background:#5eba5e;border-color:#4da64d;color:#fff}
.ac-btn.done.current{background:#6b5b95;color:#fff;border-color:#6b5b95}
.left-bottom{padding:10px 14px;border-top:1px solid #eee;font-size:13px;color:#888}
.right-panel{flex:1;overflow-y:auto;background:#f0f2f5;padding:20px 30px}
.q-display{max-width:800px;margin:0 auto}
.q-card{background:#fff;padding:24px 28px;margin-bottom:14px;border:1px solid #dde3eb}
.q-card .q-title{font-size:16px;font-weight:bold;color:#333;margin-bottom:14px;line-height:1.8}
.q-card .q-text{font-size:16px;margin-bottom:18px;line-height:1.8;white-space:pre-wrap;color:#333}
.q-card .q-text .fill-blank{display:inline-block;border-bottom:2px solid #6b5b95;min-width:160px;padding:2px 8px;color:#6b5b95;font-weight:600}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;cursor:pointer;font-size:16px;line-height:1.7;transition:all .1s;border-radius:4px}
.q-opt:hover{background:#f5f8fc}
.q-opt.selected{background:#ede7f6}
.q-opt .opt-radio{width:17px;height:17px;border:1.5px solid #999;border-radius:50%;margin-top:5px;flex-shrink:0;position:relative}
.q-opt.selected .opt-radio{border-color:#6b5b95}
.q-opt.selected .opt-radio::after{content:'';position:absolute;top:2.5px;left:2.5px;width:9px;height:9px;background:#6b5b95;border-radius:50%}
.q-opt .opt-content{flex:1}
.fill-input-wrap{margin-top:12px}
.fill-input-wrap input{width:100%;max-width:400px;padding:10px 14px;font-size:16px;border:2px solid #d5dce6;border-radius:6px;font-family:inherit}
.fill-input-wrap input:focus{outline:none;border-color:#6b5b95}
.q-nav-arrows{display:flex;justify-content:space-between;max-width:800px;margin:0 auto 16px;padding:0 4px}
.q-nav-btn{background:#fff;border:1px solid #ccc;border-radius:3px;padding:8px 24px;cursor:pointer;font-size:14px;color:#555}
.q-nav-btn:hover{background:#e0ecfa;color:#6b5b95}
.q-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.section-tag{display:inline-block;background:#6b5b95;color:#fff;padding:1px 8px;border-radius:3px;font-size:11px;margin-right:6px}
.report-wrap{display:none;flex:1;overflow-y:auto;background:#f0f2f5;padding:20px 30px}
.report-wrap .report-inner{max-width:800px;margin:0 auto}
.score-box{background:linear-gradient(135deg,#6b5b95,#52417a);color:#fff;border-radius:8px;padding:28px;text-align:center;margin-bottom:16px}
.score-box .score{font-size:3.2em;font-weight:bold}
.score-box .label{font-size:.9em;opacity:.9;margin-top:4px}
.review-card{background:#fff;border-radius:6px;padding:16px 20px;margin-bottom:10px;border:1px solid #e2e8f0;border-left:4px solid #e53935}
.review-card .r-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.review-card .r-num{background:#6b5b95;color:#fff;border-radius:3px;padding:1px 8px;font-size:12px}
.review-card .r-text{font-size:13px;margin-bottom:8px;white-space:pre-wrap;line-height:1.7}
.review-card .r-your{font-size:12px;color:#e53935;margin-bottom:3px}
.review-card .r-correct{font-size:12px;color:#4caf50;margin-bottom:3px}
.review-card .r-analysis{font-size:12px;color:#666;background:#f5f7fa;padding:10px;border-radius:4px;margin-top:6px;white-space:pre-wrap;line-height:1.7}
.review-card.correct-card{border-left-color:#4caf50}
</style>
</head>
<body>
<div class="top-bar">
  <div class="exam-title">选择题专项补充（50题）</div>
  <div class="right-info">
    <div class="timer" id="timer">00:00</div>
    <div class="stats" id="stats">已答 0/50</div>
    <button class="submit-top" onclick="confirmSubmit()">交卷</button>
  </div>
</div>
<div class="main-wrap" id="mainWrap">
  <div class="left-panel">
    <div class="panel-title">答题卡</div>
    <div class="answer-card-area" id="answer-card"></div>
    <div class="left-bottom">薄弱环节专项 · 选择50题</div>
  </div>
  <div class="right-panel" id="right-panel">
    <div class="q-display" id="q-display"></div>
    <div class="q-nav-arrows">
      <button class="q-nav-btn" id="prev-btn" onclick="prevQ()">上一题</button>
      <button class="q-nav-btn" id="next-btn" onclick="nextQ()">下一题</button>
    </div>
  </div>
</div>
<div class="report-wrap" id="report-wrap">
  <div class="report-inner" id="report-inner"></div>
</div>

<script>
const allQuestions=[
// ===== 操作系统：页面置换 =====
{id:1,sec:"页面置换",type:"choice",text:"某系统页面访问序列为 7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1，分配3个物理页框，采用FIFO算法，缺页次数为：",opts:["12","13","15","17"],ans:"C",
explain:"FIFO逐步替换：7(缺)→0(缺)→1(缺)→2(缺,替换7)→0(命中)→3(缺,替换0)→0(缺,替换1)→4(缺,替换2)→2(缺,替换3)→3(缺,替换0)→0(缺,替换4)→3(命中)→2(缺,替换2... 实际15次。"},
{id:2,sec:"页面置换",type:"choice",text:"同上页面访问序列，分配3个物理页框，采用LRU算法，缺页次数为：",opts:["12","13","15","17"],ans:"A",
explain:"LRU每次替换最久未访问的页面。逐步推导：7,0,1(缺3)→2替换7(缺)→0命中→3替换1(缺)→0命中→4替换2(缺)→2替换4(缺)→3替换2(缺)→0替换3(缺)→3命中→2命中→1替换0(缺)→0替换1(缺)→1命中→7替换2(缺)→0命中→1命中。共12次缺页。"},
{id:3,sec:"页面置换",type:"choice",text:"在页面置换算法中，Belady异常是指：",opts:["增加页框数反而缺页率上升","减少页框数缺页率下降","所有算法都会出现的异常","只在LRU算法中出现"],ans:"A",
explain:"Belady异常：增加物理页框数，缺页次数反而增加。只有FIFO可能出现。LRU和OPT是栈式算法，不会出现。"},

// ===== 操作系统：磁盘调度 =====
{id:4,sec:"磁盘调度",type:"choice",text:"磁盘当前在53号柱面，请求队列为 98,183,37,122,14,124,65,67，采用SCAN算法（向磁道号增大方向移动），访问顺序正确的是：",opts:["53→65→67→98→122→124→183→14→37","53→37→14→65→67→98→122→124→183","53→65→67→98→122→124→183→67→37→14","53→65→67→98→122→124→183→37→14"],ans:"D",
explain:"SCAN(电梯算法)：先向增大方向移动到尽头(183)，再反向。53→65→67→98→122→124→183→37→14。注意65和67在53之后按序访问。"},
{id:5,sec:"磁盘调度",type:"choice",text:"磁盘调度算法中，对请求序列 98,183,37,122,14,124,65,67（当前柱面53），SSTF（最短寻道时间优先）的首个访问目标是：",opts:["37","65","14","98"],ans:"B",
explain:"SSTF选离当前位置最近的。53距离：|98-53|=45, |183-53|=130, |37-53|=16, |122-53|=69, |14-53|=39, |124-53|=71, |65-53|=12, |67-53|=14。最近的是65(距离12)。"},

// ===== 操作系统：Cache =====
{id:6,sec:"Cache",type:"choice",text:"某系统Cache命中率为95%，Cache访问时间10ns，主存访问时间200ns，采用先访问Cache再访问主存的方式，则平均访问时间为：",opts:["19.5ns","20ns","110ns","200ns"],ans:"B",
explain:"先访问Cache再访问主存：命中时10ns，不命中时10+200=210ns。平均=0.95x10+0.05x210=9.5+10.5=20ns。如果是'同时访问'模型则为0.95x10+0.05x200=19.5ns。考试默认用本公式。"},
{id:7,sec:"Cache",type:"fill",text:"Cache命中率90%，Cache访问时间20ns，主存访问时间200ns，采用同时访问Cache和主存的方式，平均访问时间约为______ns（填整数）",ans:"38",
explain:"同时访问模型：命中时只花Cache时间20ns，不命中时花主存时间200ns。平均=0.9x20+0.1x200=18+20=38ns。与'先Cache后主存'模型不同，同时访问不命中时不需要额外加Cache时间。"},

// ===== 操作系统：进程管理 =====
{id:8,sec:"进程管理",type:"choice",text:"进程P1、P2、P3同时到达，执行时间分别为20ms、10ms、5ms，采用SJF（最短作业优先）调度，P3的周转时间为：",opts:["5ms","15ms","35ms","20ms"],ans:"A",
explain:"SJF按执行时间排序：P3(5)→P2(10)→P1(20)。P3第一个执行，周转时间=完成时间-到达时间=5-0=5ms。"},
{id:9,sec:"进程管理",type:"choice",text:"同上条件，采用SJF调度，P1的周转时间为：",opts:["20ms","30ms","35ms","55ms"],ans:"C",
explain:"SJF排序：P3(5)→P2(10)→P1(20)。P1最后完成，周转时间=5+10+20-0=35ms。"},

// ===== 操作系统：死锁 =====
{id:10,sec:"死锁",type:"choice",text:"系统有3类资源，向量(10,5,7)。三个进程已分配资源：P1(0,1,0)、P2(2,0,0)、P3(3,0,2)。最大需求：P1(7,5,3)、P2(3,2,2)、P3(9,0,2)。当前系统状态是安全的，因为存在安全序列：",opts:["P1→P2→P3","P2→P1→P3","P3→P2→P1","P2→P3→P1"],ans:"B",
explain:"可用=(10-5, 5-1, 7-2)=(5,4,5)。P2还需(1,2,2)<=可用(5,4,5)→执行完释放→可用(7,4,5)。P1还需(7,4,3)<=可用(7,4,5)→执行完释放→可用(7,5,5)。P3还需(6,0,0)<=可用(7,5,5)。安全序列P2→P1→P3。"},

// ===== 计算机组成：Flynn分类 =====
{id:11,sec:"Flynn分类",type:"choice",text:"Flynn分类法中，SISD代表：",opts:["单指令流单数据流","单指令流多数据流","多指令流单数据流","多指令流多数据流"],ans:"A",
explain:"SISD=单指令单数据(传统串行)。SIMD=单指令多数据(GPU/向量机)。MISD=多指令单数据(少实际应用)。MIMD=多指令多数据(多核/集群)。"},
{id:12,sec:"Flynn分类",type:"choice",text:"GPU的并行计算模式属于Flynn分类中的：",opts:["SISD","SIMD","MISD","MIMD"],ans:"B",
explain:"GPU对大量数据执行相同指令→SIMD(单指令多数据流)。多核CPU各核独立执行不同指令→MIMD。"},

// ===== 计算机组成：浮点数 =====
{id:13,sec:"浮点数",type:"choice",text:"浮点数表示中，阶码的位数决定了：",opts:["精度","表示范围","尾数的正负","小数点位置"],ans:"B",
explain:"阶码=指数部分，决定表示范围(数量级)。尾数=有效数字部分，决定精度。阶码越大，能表示的数范围越大。"},
{id:14,sec:"浮点数",type:"choice",text:"IEEE 754单精度浮点数中，阶码采用的编码方式是：",opts:["原码","反码","移码(偏移127)","补码"],ans:"C",
explain:"IEEE 754单精度：1位符号+8位阶码(移码，偏移量127)+23位尾数。双精度：1+11(偏移1023)+52。"},

// ===== 计算机组成：存储 =====
{id:15,sec:"存储计算",type:"choice",text:"某计算机字长32位，内存容量4GB，按字编址的寻址范围是：",opts:["2^30","2^32","2^28","4G"],ans:"A",
explain:"4GB = 2^32 字节。字长32位=4字节。按字编址：2^32 / 4 = 2^30 个地址。按字节编址才是2^32。"},

// ===== 计算机组成：流水线深入 =====
{id:16,sec:"流水线",type:"choice",text:"4级流水线，取指2ns、译码2ns、执行3ns、写回2ns，执行100条指令的吞吐率为：",opts:["约333百万条/秒","约500百万条/秒","约250百万条/秒","约400百万条/秒"],ans:"A",
explain:"时钟周期=3ns。吞吐率=n/总时间=100/((4+100-1)x3)=100/309ns=100/(309x10^-9)=3.24x10^8约333x10^6条/秒。"},

// ===== 编译原理 =====
{id:17,sec:"编译原理",type:"choice",text:"编译器的前端（Front End）主要负责：",opts:["目标代码生成和优化","词法分析、语法分析、语义分析","中间代码优化","机器码生成"],ans:"B",
explain:"前端=词法+语法+语义+中间代码生成（与源语言相关）。后端=中间代码优化+目标代码生成（与目标机器相关）。前端与后端通过中间代码(IR)连接。"},
{id:18,sec:"编译原理",type:"choice",text:"以下哪个阶段会检测程序中的类型错误？",opts:["词法分析","语法分析","语义分析","代码生成"],ans:"C",
explain:"词法=识别token。语法=检查语法结构(括号匹配等)。语义=类型检查、作用域分析、类型转换。代码生成=输出目标代码。"},

// ===== 网络深层 =====
{id:19,sec:"网络协议",type:"choice",text:"TCP建立连接需要三次握手，第三次握手的作用是：",opts:["客户端确认收到服务器的SYN","服务器确认收到客户端的ACK","防止已失效的连接请求到达服务器","同步双方的序列号"],ans:"C",
explain:"第三次握手(客户端发ACK)的核心目的：防止已失效的连接请求被服务器误认为新连接。如果只有两次握手，服务器收到过期SYN会直接建立连接浪费资源。"},
{id:20,sec:"网络协议",type:"choice",text:"HTTPS在HTTP和TCP之间增加了：",opts:["IPSec协议","SSL/TLS协议","SSH协议","FTP协议"],ans:"B",
explain:"HTTPS = HTTP + SSL/TLS。SSL/TLS位于传输层之上、应用层之下，提供加密传输、身份认证、数据完整性。"},
{id:21,sec:"网络协议",type:"choice",text:"OSPF协议属于哪种类型的路由协议？",opts:["距离向量协议","链路状态协议","路径向量协议","外部网关协议"],ans:"B",
explain:"OSPF=链路状态协议(使用Dijkstra算法)。RIP=距离向量协议(跳数限制15)。BGP=路径向量协议(外部网关)。"},

// ===== 项目管理 =====
{id:22,sec:"项目管理",type:"choice",text:"PERT图中，活动的期望时间计算公式为：",opts:["(最乐观+最可能+最悲观)/3","(最乐观+4x最可能+最悲观)/6","(最乐观+最悲观)/2","最可能时间"],ans:"B",
explain:"PERT期望值 = (O + 4M + P) / 6。O=最乐观，M=最可能，P=最悲观。标准差 = (P-O)/6。"},
{id:23,sec:"项目管理",type:"choice",text:"WBS（工作分解结构）的主要作用是：",opts:["确定项目进度","估算项目成本","将项目工作分解为可管理的工作包","分配项目资源"],ans:"C",
explain:"WBS=Work Breakdown Structure，将项目分解为层次化的工作包。是范围管理的核心工具，不是进度/成本/资源工具。"},

// ===== 软件测试深层 =====
{id:24,sec:"软件测试",type:"choice",text:"集成测试中，自顶向下策略需要使用什么来替代未完成的下层模块？",opts:["驱动模块(Driver)","桩模块(Stub)","测试用例","测试脚本"],ans:"B",
explain:"自顶向下→用桩模块(Stub)替代下层。自底向上→用驱动模块(Driver)替代上层。桩=模拟被调用者。驱动=模拟调用者。"},
{id:25,sec:"软件测试",type:"choice",text:"回归测试的目的是：",opts:["测试新开发的功能","验证修改后系统仍然正常","进行性能压力测试","测试系统安全性"],ans:"B",
explain:"回归测试=修改代码后重新测试，确保原有功能没有被破坏。不是测新功能，而是验证老功能没被改坏。"},

// ===== 标准化 =====
{id:26,sec:"标准化",type:"choice",text:"ISO 9000系列标准主要关注的是：",opts:["信息安全","质量管理体系","项目管理","软件过程改进"],ans:"B",
explain:"ISO 9000=质量管理体系标准族。ISO 27000=信息安全。ISO 20000=IT服务管理。CMMI=软件过程改进。"},
{id:27,sec:"标准化",type:"choice",text:"我国国家标准的代号是：",opts:["ISO","GB","IEEE","ANSI"],ans:"B",
explain:"GB=国标(中国)。ISO=国际标准化组织。IEEE=电气电子工程师学会(美国)。ANSI=美国国家标准学会。"},

// ===== 知识产权深层 =====
{id:28,sec:"知识产权",type:"choice",text:"以下哪种行为属于合理使用？",opts:["复制整本教材出售","为个人学习少量复制已发表作品","将他人软件上传到互联网供下载","在商业产品中使用开源代码但不遵守协议"],ans:"B",
explain:"合理使用：为个人学习/研究/欣赏，少量复制已发表作品。大量复制、商业使用、不遵守开源协议都不属于合理使用。"},
{id:29,sec:"知识产权",type:"choice",text:"软件著作权的保护期限为：",opts:["自开发完成后25年","自发表后50年","作者终生及死后50年","永久保护"],ans:"C",
explain:"自然人：作者终生+死后50年。法人/组织：首次发表后50年（未发表则不保护）。注意：软件著作权自开发完成自动产生，不需要登记。"},

// ===== 嵌入式 =====
{id:30,sec:"嵌入式",type:"choice",text:"嵌入式系统中，硬实时系统的特点是：",opts:["允许偶尔超时","任务必须在截止时间内完成，否则后果严重","不需要操作系统","只用于消费电子"],ans:"B",

// ===== 命题逻辑 =====
{id:50,sec:"数理逻辑",type:"choice",text:"命题「如果下雨，则地湿」的逆否命题是：",opts:["如果地湿，则下雨","如果不下雨，则地不湿","如果地不湿，则不下雨","下雨且地不湿"],ans:"C",
explain:"原命题P→Q。逆否命题=非Q→非P。逆命题=Q→P。否命题=非P→非Q。原命题与逆否命题等价。"}
];

let userAnswers={};
let currentQ=1;
let submitted=false;
const STORAGE_KEY='arch_supplement_v1';
const TOTAL=allQuestions.length;

function init(){loadProgress();renderAnswerCard();renderQuestion(currentQ);updateProgress();startTimer();}
function loadProgress(){try{const s=localStorage.getItem(STORAGE_KEY);if(s){const d=JSON.parse(s);userAnswers=d.answers||{};currentQ=d.currentQ||1;}}catch(e){}}
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({answers:userAnswers,currentQ:currentQ}));}catch(e){}}

function renderAnswerCard(){
  const c=document.getElementById('answer-card');
  let h='<div class="ac-grid">';
  for(let i=1;i<=TOTAL;i++){
    const cls=(i===currentQ?' current':'')+(userAnswers[i]?' done':'');
    h+=`<button class="ac-btn${cls}" id="acb-${i}" onclick="goToQ(${i})">${i}</button>`;
  }
  h+='</div>';
  c.innerHTML=h;
}

function updateAnswerCard(){
  document.querySelectorAll('.ac-btn').forEach(b=>{
    const id=parseInt(b.textContent);
    b.classList.remove('current','done');
    if(id===currentQ) b.classList.add('current');
    if(userAnswers[id]) b.classList.add('done');
  });
}

function renderQuestion(qId){
  const q=allQuestions.find(x=>x.id===qId);
  if(!q) return;
  const letters=['A','B','C','D'];
  let h=`<div class="q-card">`;
  h+=`<div class="q-title"><span class="section-tag">${q.sec}</span>第${qId}题（共${TOTAL}题）${q.type==='fill'?' · 填空题':''}</div>`;
  h+=`<div class="q-text">${q.text.replace(/______/g,'<span class="fill-blank">　　　　</span>')}</div>`;

  if(q.type==='choice'){
    h+=`<div class="q-options">`;
    q.opts.forEach((o,i)=>{
      const s=userAnswers[qId]===letters[i]?' selected':'';
      h+=`<div class="q-opt${s}" onclick="selectOption(${qId},'${letters[i]}')"><div class="opt-radio"></div><div class="opt-content">${letters[i]}. ${o}</div></div>`;
    });
    h+=`</div>`;
  } else {
    const val=userAnswers[qId]||'';
    h+=`<div class="fill-input-wrap"><input type="text" id="fill-input" value="${val}" placeholder="请输入答案" oninput="fillAnswer(${qId})"></div>`;
  }
  h+=`</div>`;
  document.getElementById('q-display').innerHTML=h;
  document.getElementById('prev-btn').disabled=(qId<=1);
  document.getElementById('next-btn').disabled=(qId>=TOTAL);
  document.getElementById('next-btn').textContent=qId>=TOTAL?'已是最后一题':'下一题 ▶';
  updateAnswerCard();
}

function selectOption(qId,letter){
  if(submitted) return;
  userAnswers[qId]=letter;
  saveProgress();
  updateProgress();
  const c=document.querySelector('.q-card');
  c.querySelectorAll('.q-opt').forEach(o=>o.classList.remove('selected'));
  c.querySelectorAll('.q-opt').forEach(o=>{
    if(o.querySelector('.opt-content').textContent.trim().startsWith(letter+'.')) o.classList.add('selected');
  });
  updateAnswerCard();
}

function fillAnswer(qId){
  if(submitted) return;
  const el=document.getElementById('fill-input');
  userAnswers[qId]=el?el.value.trim():'';
  saveProgress();
  updateProgress();
  updateAnswerCard();
}

function goToQ(id){currentQ=id;saveProgress();renderQuestion(id);document.getElementById('right-panel').scrollTop=0;}
function prevQ(){if(currentQ>1) goToQ(currentQ-1);}
function nextQ(){if(currentQ<TOTAL) goToQ(currentQ+1);}
function updateProgress(){document.getElementById('stats').textContent=`已答 ${Object.keys(userAnswers).filter(k=>userAnswers[k]).length}/${TOTAL}`;}

function confirmSubmit(){
  const u=TOTAL-Object.keys(userAnswers).filter(k=>userAnswers[k]).length;
  let m='确定要交卷吗？';
  if(u>0) m+=`还有 ${u} 题未作答。`;
  if(confirm(m)) submitExam();
}

function submitExam(){
  if(submitted) return;
  submitted=true;
  clearInterval(timerInterval);
  let correct=0,wrongList=[];

  allQuestions.forEach(q=>{
    const ua=userAnswers[q.id]||'';
    let isCorrect=false;
    if(q.type==='choice'){
      isCorrect=(ua===q.ans);
    } else {
      isCorrect=(ua===q.ans);
    }
    if(isCorrect) correct++;
    else wrongList.push(q);
  });

  const pct=Math.round(correct/TOTAL*100);
  const pass=pct>=80?'🎉 恭喜过关！':'⚠️ 未达标，需要继续复习';
  const timeStr=document.getElementById('timer').textContent;

  let h=`<div class="score-box"><div class="score">${correct}/${TOTAL}</div><div class="label">正确率 ${pct}% · 用时${timeStr} · ${pass}</div></div>`;

  if(wrongList.length>0){
    h+=`<div class="review-card" style="border-left-color:#6b5b95"><div class="r-header"><span class="r-num">错题解析（${wrongList.length}题）</span></div></div>`;
    wrongList.forEach(q=>{
      const ua=userAnswers[q.id]||'未作答';
      const letters=['A','B','C','D'];
      let correctText, userText;
      if(q.type==='choice'){
        const ansIdx=letters.indexOf(q.ans);
        correctText=q.ans+'. '+q.opts[ansIdx];
        const uaIdx=letters.indexOf(ua);
        userText=uaIdx>=0?ua+'. '+q.opts[uaIdx]:ua;
      } else {
        correctText=q.ans;
        userText=ua;
      }
      h+=`<div class="review-card"><div class="r-header"><span class="r-num">第${q.id}题</span><span style="color:#999;font-size:12px">${q.sec}</span></div><div class="r-text">${q.text}</div><div class="r-your">你的答案：${userText}</div><div class="r-correct">正确答案：${correctText}</div><div class="r-analysis">${q.explain}</div></div>`;
    });
  } else {
    h+='<p style="text-align:center;color:#4caf50;font-size:1.1em;padding:20px">全部正确！完美过关！</p>';
  }

  document.getElementById('mainWrap').style.display='none';
  document.querySelector('.top-bar').style.display='none';
  document.getElementById('report-inner').innerHTML=h;
  document.getElementById('report-wrap').style.display='block';
  localStorage.removeItem(STORAGE_KEY);
}

let startTime=Date.now();
let timerInterval=setInterval(()=>{
  if(submitted) return;
  const s=Math.floor((Date.now()-startTime)/1000);
  const m=Math.floor(s/60);
  const ss=s%60;
  document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
},1000);

document.addEventListener('keydown',function(e){
  if(submitted) return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();prevQ();}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();nextQ();}
  const q=allQuestions.find(x=>x.id===currentQ);
  if(q&&q.type==='choice'){
    const letters=['A','B','C','D'];
    const idx=letters.indexOf(e.key.toUpperCase());
    if(idx>=0&&idx<q.opts.length) selectOption(currentQ,letters[idx]);
  }
});

init();
</script>
